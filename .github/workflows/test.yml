name: Test real Siroino dance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile motion_catalog.py dance_renderer.py video_generation.py main.py
      - run: xvfb-run -a python -m pytest -q
