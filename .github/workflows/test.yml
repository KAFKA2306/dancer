name: Test real Siroino dance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb
      - run: uv sync --locked
      - run: uv run --frozen python -m compileall -q src tests
      - run: xvfb-run -a uv run --frozen pytest -q
