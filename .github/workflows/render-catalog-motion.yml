name: Render catalog motion

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"
      timezone: "Asia/Tokyo"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb
      - run: python -m pip install -r requirements.txt
      - name: Render today's catalog motion
        run: |
          mkdir -p output
          xvfb-run -a python main.py \
            --motion-id auto \
            --output-dir output \
            --duration-seconds 1 \
            --fps 6 \
            --size 128 > output/metadata.json
      - uses: actions/upload-artifact@v7
        with:
          name: catalog-motion-${{ github.run_id }}
          path: |
            output/dance.mp4
            output/metadata.json
          if-no-files-found: error
          retention-days: 30
