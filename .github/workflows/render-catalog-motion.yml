name: Render catalog motion

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"
      timezone: "Asia/Tokyo"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb
      - run: uv sync --locked --no-dev
      - name: Render today's catalog motion
        run: |
          mkdir -p output
          xvfb-run -a uv run --frozen --no-dev dancer \
            --motion-id auto \
            --output-dir output \
            --duration-seconds 1 \
            --fps 6 \
            --size 128 > output/metadata.json
      - uses: actions/upload-artifact@v7
        with:
          name: catalog-motion-${{ github.run_id }}
          path: |
            output/dance.mp4
            output/metadata.json
          if-no-files-found: error
          retention-days: 30
