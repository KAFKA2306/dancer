name: Autonomous production

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "27 9 * * *"
      timezone: "Asia/Tokyo"

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      DANCER_YOUTUBE_PROFILE: ${{ vars.DANCER_YOUTUBE_PROFILE || 'byosan' }}
      YT3_REVISION: "f22d2fc2a823703344da7a5cf44ee2b8a6b2a42c"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"
      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: "3.52.0"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb
      - run: uv sync --locked --no-dev
      - name: Prepare authenticated YT3 publication
        id: yt3
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "reason=PR_EXTERNAL_SIDE_EFFECTS_DISABLED" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$YOUTUBE_CLIENT_ID" || -z "$YOUTUBE_CLIENT_SECRET" || -z "$YOUTUBE_REFRESH_TOKEN" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "reason=YOUTUBE_CREDENTIALS_MISSING" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git clone --filter=blob:none --no-checkout https://github.com/KAFKA2306/yt3.git "$RUNNER_TEMP/yt3"
          git -C "$RUNNER_TEMP/yt3" fetch --depth=1 origin "$YT3_REVISION"
          git -C "$RUNNER_TEMP/yt3" checkout --detach "$YT3_REVISION"
          test "$(git -C "$RUNNER_TEMP/yt3" rev-parse HEAD)" = "$YT3_REVISION"
          bun install --cwd "$RUNNER_TEMP/yt3" --frozen-lockfile
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "root=$RUNNER_TEMP/yt3" >> "$GITHUB_OUTPUT"
          echo "revision=$YT3_REVISION" >> "$GITHUB_OUTPUT"
          echo "reason=AUTHENTICATED" >> "$GITHUB_OUTPUT"
      - name: Produce, audit, and publish when authenticated
        id: produce
        shell: bash
        run: |
          set -uo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            duration=2
            fps=3
            width=180
            height=320
            candidates=2
          else
            duration=8
            fps=24
            width=1080
            height=1920
            candidates=3
          fi
          args=(
            production
            --output-dir output
            --motion-id auto
            --audio-id auto
            --duration-seconds "$duration"
            --fps "$fps"
            --width "$width"
            --height "$height"
            --candidates "$candidates"
          )
          if [[ "${{ steps.yt3.outputs.enabled }}" == "true" ]]; then
            args+=(
              --yt3-root "${{ steps.yt3.outputs.root }}"
              --publish-profile "$DANCER_YOUTUBE_PROFILE"
            )
          fi
          set +e
          xvfb-run -a uv run --frozen --no-dev dancer "${args[@]}" > output-result.json 2> production-error.log
          exit_code=$?
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          if [[ $exit_code -ne 0 ]]; then
            tail -c 4000 production-error.log >&2 || true
            exit "$exit_code"
          fi
      - name: Record publication and failure boundary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          enabled = "${{ steps.yt3.outputs.enabled }}" == "true"
          reason = "${{ steps.yt3.outputs.reason }}" or "UNKNOWN"
          exit_code_text = "${{ steps.produce.outputs.exit_code }}"
          exit_code = int(exit_code_text) if exit_code_text.isdigit() else None
          event = os.environ.get("GITHUB_EVENT_NAME", "")

          manifests = list(Path("output").glob("runs/**/manifest.json")) if Path("output").exists() else []
          audits = list(Path("output").glob("runs/**/candidates/**/audit.json")) if Path("output").exists() else []
          result = None
          result_path = Path("output-result.json")
          if result_path.is_file() and result_path.stat().st_size:
              for line in reversed(result_path.read_text(encoding="utf-8").splitlines()):
                  line = line.strip()
                  if not line.startswith("{"):
                      continue
                  try:
                      candidate = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if isinstance(candidate, dict) and candidate.get("run_id"):
                      result = candidate
                      break

          if result and result.get("publish_status") == "published_or_scheduled":
              last_completed_stage = "YT3_PUBLICATION_VERIFIED"
          elif manifests:
              last_completed_stage = "MANIFEST_AND_POLICY_GATE_PASSED"
          elif audits:
              last_completed_stage = "CANDIDATE_AUDIT_PARTIAL"
          else:
              last_completed_stage = "PRODUCTION_NOT_COMPLETED"

          if exit_code not in (None, 0):
              status = "FAILED"
              failure_kind = "EXTERNAL_PUBLICATION_FAILURE" if enabled and manifests else "LOCAL_PRODUCTION_FAILURE"
              failure_reason = f"dancer production exited with code {exit_code}"
          elif event == "pull_request":
              status = "EXTERNAL_SIDE_EFFECTS_DISABLED"
              failure_kind = None
              failure_reason = None
          elif not enabled:
              status = "PUBLICATION_BLOCKED"
              failure_kind = "MISSING_CREDENTIALS"
              failure_reason = reason
          elif result and result.get("publish_status") == "published_or_scheduled":
              status = "PUBLICATION_VERIFIED"
              failure_kind = None
              failure_reason = None
          else:
              status = "PUBLICATION_NOT_VERIFIED"
              failure_kind = "EXTERNAL_PUBLICATION_FAILURE"
              failure_reason = "production completed without a verified YT3 publication status"

          payload = {
              "status": status,
              "reason": reason,
              "profile": os.environ.get("DANCER_YOUTUBE_PROFILE"),
              "dancer_revision": os.environ.get("GITHUB_SHA"),
              "yt3_revision": "${{ steps.yt3.outputs.revision }}",
              "last_completed_stage": last_completed_stage,
              "failure_kind": failure_kind,
              "failure_reason": failure_reason,
              "production_exit_code": exit_code,
              "credentials_in_artifact": False,
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
          }
          Path("publication-state.json").write_text(json.dumps(payload, indent=2), encoding="utf-8")
          PY
      - name: Secret-scan generated JSON evidence
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          forbidden_key = re.compile(r'(?i)(client[_-]?secret|refresh[_-]?token|access[_-]?token|authorization|cookie)')
          secret_values = [
              value
              for value in (
                  os.environ.get("YOUTUBE_CLIENT_SECRET", ""),
                  os.environ.get("YOUTUBE_REFRESH_TOKEN", ""),
              )
              if len(value) >= 8
          ]
          files = list(Path("output").glob("runs/**/*.json")) if Path("output").exists() else []
          files += [path for path in (Path("output-result.json"), Path("publication-state.json")) if path.exists()]
          violations = []
          for path in files:
              text = path.read_text(encoding="utf-8", errors="strict")
              if forbidden_key.search(text):
                  violations.append(f"{path}: forbidden credential key")
              if any(secret in text for secret in secret_values):
                  violations.append(f"{path}: secret value present")
          if violations:
              raise SystemExit("Generated artifact secret scan failed: " + "; ".join(violations))
          print(f"secret scan passed for {len(files)} JSON evidence files")
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: autonomous-production-${{ github.run_id }}
          path: |
            output/runs/**/manifest.json
            output/runs/**/presentation/*
            output/runs/**/candidates/**/audit.json
            output-result.json
            publication-state.json
          if-no-files-found: warn
          retention-days: 30
